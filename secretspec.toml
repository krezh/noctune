[project]
name = "noctune"
revision = "1.0"
require_reason = false

[providers]
# client_id/client_secret below are Universal Auth machine-identity
# credentials sourced from the OS keyring (not stored in this file or
# in plain env vars) — run `secretspec config provider login infisical`
# to store them.
infisical = { uri = "infisical://eu.infisical.com/5e13949c-f810-489d-88bd-0749b9474dbb?env=default", credentials = { client_id = "keyring", client_secret = "keyring" } }
dotenv = "dotenv://.env"

[profiles.default]
DISCORD_BOT_TOKEN = { description = "Discord bot token (Developer Portal > your app > Bot > Token)", required = true }
DISCORD_TEST_GUILD_ID = { description = "Guild ID to register slash commands to instantly during development", required = false }
SPOTIFY_CLIENT_ID = { description = "Spotify Web API app Client ID (Client Credentials flow)", required = true }
SPOTIFY_CLIENT_SECRET = { description = "Spotify Web API app Client Secret", required = true }
WEB_LISTEN_ADDR = { description = "Address the web GUI listens on", required = false, default = ":8080" }
WEB_AUTH_TOKEN = { description = "Shared secret required to use the web GUI; leave unset only on a fully trusted network", required = false }
WEB_PUBLIC_URL = { description = "Externally reachable base URL for the web GUI, used for Discord chat links and to derive the OAuth2 redirect URL", required = false }
DISCORD_CLIENT_ID = { description = "Discord application's OAuth2 Client ID (Developer Portal > your app > OAuth2), enables per-user Discord login for the web GUI", required = false }
DISCORD_CLIENT_SECRET = { description = "Discord application's OAuth2 Client Secret", required = false }
DISCORD_OAUTH_REDIRECT_URL = { description = "OAuth2 callback URL registered in the Developer Portal; defaults to WEB_PUBLIC_URL + /auth/discord/callback if unset", required = false }
SESSION_SECRET = { description = "Fixed key (e.g. `openssl rand -hex 32`) signing web GUI session cookies; unset generates a random one at startup, which signs everyone out on every restart", required = false }
DEFAULT_VOLUME = { description = "Default playback volume, 0-100 (100 = unchanged)", required = false, default = "100" }
MAX_QUEUE_SIZE = { description = "Max tracks allowed in a single guild's queue", required = false, default = "500" }
IDLE_DISCONNECT_SECONDS = { description = "Seconds of no playback before the bot leaves voice; 0 disables auto-leave", required = false, default = "300" }
LOG_LEVEL = { description = "Log verbosity", required = false, default = "info" }
FFMPEG_PATH = { description = "Path to the ffmpeg binary, if not on PATH", required = false, default = "ffmpeg" }
YTDLP_PATH = { description = "Path to the yt-dlp binary, if not on PATH", required = false, default = "yt-dlp" }
